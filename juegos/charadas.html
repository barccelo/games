<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1119"><title>Charadas Pro Max · Games</title>
<link rel="stylesheet" href="./ui.css?v=9"><script defer src="./charadas.js?v=2"></script></head>
<body data-game="charadas"><main class="wrap charades-page">
<header class="top"><a class="back" href="../">← Games</a><span class="brand">Charadas Pro Max</span></header>
<h1>Charadas Pro Max</h1>
<section class="panel charades-stage">
<div class="row between"><span id="chTurn" class="tag">Equipo A</span><span id="chProgress" class="secondary">Palabra 1 de 10</span></div>
<div class="charades-word" id="chWord" aria-live="polite">Titanic</div>
<div class="charades-clock" id="chClock" role="timer">01:00</div>
<div class="stack charades-actions">
<button id="chHit">✓ Acertó · +1</button>
<button id="chPass" class="alt">Pasar</button>
</div>
<div class="row charades-controls">
<button id="chStart" class="alt">Iniciar tiempo</button>
<button id="chPause" class="alt" disabled>Pausar</button>
<button id="chNext" class="alt">Cambiar equipo</button>
</div>
<p id="chStatus" class="secondary" role="status">La palabra es visible para quien hace la mímica.</p>
</section>
<section class="panel charades-scoreboard">
<div class="row between"><h2>Puntuación</h2><span id="chRound" class="secondary">Turno 1</span></div>
<div class="scores">
<div id="chBox0" class="score active"><span id="chName0" class="name">Equipo A</span><strong id="chScore0">0</strong>
<div class="scoretools"><button class="alt smallbtn" data-chscore="0:-1" aria-label="Restar punto al equipo A">−</button><button class="alt smallbtn" data-chscore="0:1" aria-label="Sumar punto al equipo A">+</button></div></div>
<div id="chBox1" class="score"><span id="chName1" class="name">Equipo B</span><strong id="chScore1">0</strong>
<div class="scoretools"><button class="alt smallbtn" data-chscore="1:-1" aria-label="Restar punto al equipo B">−</button><button class="alt smallbtn" data-chscore="1:1" aria-label="Sumar punto al equipo B">+</button></div></div>
</div>
</section>
<details class="panel charades-settings" id="chSettings">
<summary>Equipos y palabras</summary>
<div class="row"><div class="col"><label for="chA">Equipo A</label><input id="chA" maxlength="30" value="Equipo A"></div>
<div class="col"><label for="chB">Equipo B</label><input id="chB" maxlength="30" value="Equipo B"></div>
<div class="col"><label for="chDuration">Segundos por turno</label><input type="number" min="10" max="600" id="chDuration" value="60"></div></div>
<hr class="divider">
<div class="row"><div class="col"><label for="chCategory">Categoría</label><select id="chCategory"><option value="">Todas</option><option value="Películas o series">Películas y series</option><option value="Personas o personajes">Personas y personajes</option><option value="Lugares">Lugares</option></select></div>
<div class="col"><label for="chLevel">Dificultad</label><select id="chLevel"><option value="fácil">Fácil</option><option value="medio" selected>Media</option><option value="difícil">Difícil</option></select></div>
<div class="col"><label for="chCount">Número de palabras</label><input id="chCount" type="number" min="1" max="15" value="10"></div></div>
<div class="stack" style="margin-top:16px"><button id="chGenerate">Preparar nuevas palabras</button><button id="chLocal" class="alt">Usar palabras incluidas</button></div>
<div class="charades-manual"><label for="chManual">Mis palabras (una por línea)</label><textarea id="chManual" rows="5" placeholder="Titanic&#10;El rey león&#10;Shakira&#10;Aeropuerto"></textarea><button id="chUseManual" class="alt">Jugar con mis palabras</button><p class="secondary" id="chManualStatus"></p></div><button class="warn" id="chReset" style="margin-top:12px">Reiniciar puntuaciones</button>
</details>
</main></body></html>
