<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1119">
<title>Contacto · Games</title>
<link rel="stylesheet" href="./ui.css?v=6">
<script defer src="./contacto.js?v=2"></script>
</head>
<body data-game="contacto"><main class="wrap contact-page">
<header class="top"><a class="back" href="../">← Games</a><span class="brand">Contacto</span></header>
<h1>Contacto</h1>
<section class="panel setup-panel" id="contactSetup">
<h2>Palabra del Guardián</h2>
<p>Escríbela en privado. Solo se mostrará la primera letra al empezar.</p>
<form id="contactForm" class="contact-form">
<div class="contact-entry"><label for="secret">Palabra secreta</label><div class="contact-input"><input id="secret" type="password" maxlength="35" autocomplete="off" autocapitalize="characters" placeholder="Introduce una palabra" required><button id="secretEye" type="button" aria-label="Mostrar palabra mientras se escribe" aria-pressed="false" title="Mostrar palabra"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<button class="contact-submit" type="submit">Comenzar partida</button>
</form>
<p id="secretHelp" class="secondary">De 2 a 35 letras, sin espacios.</p>
</section>
<section id="contactPlay" class="contact-play" hidden>
<div class="contact-stats">
<div class="contact-stat"><span>Duración</span><strong id="contactClock" role="timer">00:00</strong></div>
<div class="contact-stat"><span>Contactos bloqueados</span><strong id="contactBlocked">0</strong></div>
</div>
<section class="panel contact-stage" aria-label="Palabra de la partida">
<div class="row between"><span class="tag" id="contactProgress">1 letra revelada</span>
<button id="contactEye" class="icon-action" aria-pressed="false" aria-label="Mostrar palabra secreta" title="Mostrar palabra">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
<span id="contactEyeLabel">Ver palabra</span></button></div>
<div id="contactLetters" class="letters" aria-live="polite"></div>
<div id="contactSecret" class="contact-secret" hidden></div>
<div class="contact-main-actions">
<button id="contactReveal">Revelar siguiente letra</button>
<button id="contactBlock" class="alt">+ Contacto bloqueado</button>
</div>
<p id="contactStatus" class="secondary" role="status">Partida en curso.</p>
</section>
<div class="row contact-footer-actions">
<button id="contactPause" class="alt">Pausar reloj</button>
<button id="contactWon">Finalizar partida</button>
<button id="contactReset" class="warn">Nueva palabra</button>
</div>
<section id="contactSummary" class="panel" hidden aria-live="polite">
<h2>Partida finalizada</h2>
<p id="contactResult"></p>
</section>
</section>
</main></body></html>
