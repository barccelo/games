<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1119">
<title>Alphabetics · Games</title><link rel="stylesheet" href="./ui.css?v=13"><script defer src="./alphabetics-banco.js?v=1"></script><script defer src="./alphabetics.js?v=3"></script><script defer src="./controles.js?v=1"></script></head>
<body class="challenge-page alphabetics-page"><main class="wrap">
<header class="top"><a class="back" href="../">← Games</a><div class="top-right"><span class="brand">Alphabetics</span><button class="settings-toggle" type="button" data-settings-target="abOptions" aria-label="Configuración" title="Configuración" aria-expanded="false"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 14 4l2.4-.5 1 2.3 2.3 1-.5 2.4 1.5 2-1.5 2 .5 2.4-2.3 1-1 2.3-2.4-.5-2 1.5-2-1.5-2.4.5-1-2.3-2.3-1 .5-2.4-1.5-2 1.5-2-.5-2.4 2.3-1 1-2.3L10 4Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></header>
<h1>Alphabetics</h1>
<section class="panel alphabetics-board">
<div class="row between"><span id="abPhase" class="tag">Primera mitad · 30 segundos</span><span id="abCount" class="secondary">0 de 10 aciertos</span></div>
<div class="ab-track-wrap"><div class="ab-track" id="abTrack" aria-label="Diez letras de la partida"></div></div>
<div class="ab-focus">
<div id="abWord" class="challenge-word">ÁRBOL</div>
<div id="abTime" class="challenge-time" role="timer">00:30</div>
</div>
<div class="ab-actions"><button id="abHit">✓ Acertó</button><button id="abPass" class="alt">Pasar</button><button id="abReplace" class="alt">Sustituir palabra</button></div>
<div class="ab-actions"><button id="abStart">Iniciar 30 segundos</button><button id="abPause" class="alt" disabled>Pausar</button></div>
<p id="abStatus" class="secondary" role="status">Da pistas de una sola palabra. Solo quien da las pistas puede pasar.</p>
</section>
<details class="panel" id="abOptions">
<summary>Preparar las 10 palabras</summary>
<div class="row ab-setup-row">
<div class="col"><label for="abStartMode">Letra inicial</label><select id="abStartMode"><option value="random" selected>Aleatoria</option><option value="A">Desde la A</option></select></div>
<div class="col"><label for="abLevel">Dificultad</label><select id="abLevel"><option value="fácil">Fácil</option><option value="medio" selected>Media</option><option value="difícil">Difícil</option></select></div>
</div>
<div class="ab-setup-buttons"><button id="abLocal" class="alt">Preparar recorrido</button><button id="abGenerate">Generar con IA</button></div>
<p class="secondary">También puedes editar cada respuesta. Las diez palabras deben comenzar por la letra indicada.</p>
<div id="abEditor" class="ab-editor"></div>
<button id="abSave" class="ab-save">Guardar mis palabras</button>
</details>
</main></body></html>
