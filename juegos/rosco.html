<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1119"><title>Preparar rosco · Games</title><link rel="stylesheet" href="./ui.css?v=13"><script defer src="./palabras.js?v=2"></script><script defer src="./rosco.js?v=2"></script><script defer src="./controles.js?v=1"></script></head>
<body class="challenge-page"><main class="wrap">
<header class="top"><a class="back" href="../">← Games</a><div class="top-right"><span class="brand">Preparar rosco</span><button class="settings-toggle" type="button" data-settings-target="roEdit" aria-label="Configuración" title="Configuración" aria-expanded="false"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 14 4l2.4-.5 1 2.3 2.3 1-.5 2.4 1.5 2-1.5 2 .5 2.4-2.3 1-1 2.3-2.4-.5-2 1.5-2-1.5-2.4.5-1-2.3-2.3-1 .5-2.4-1.5-2 1.5-2-.5-2.4 2.3-1 1-2.3L10 4Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></header>
<h1>Preparar rosco</h1><p class="sub">Palabras y definiciones para organizar una partida de Pasapalabras.</p>
<nav class="rosco-letters" id="roLetters" aria-label="Elegir letra"><button class="alt" data-letter="0" type="button">A</button><button class="alt" data-letter="1" type="button">B</button><button class="alt" data-letter="2" type="button">C</button><button class="alt" data-letter="3" type="button">D</button><button class="alt" data-letter="4" type="button">E</button><button class="alt" data-letter="5" type="button">F</button><button class="alt" data-letter="6" type="button">G</button><button class="alt" data-letter="7" type="button">H</button><button class="alt" data-letter="8" type="button">I</button><button class="alt" data-letter="9" type="button">J</button><button class="alt" data-letter="10" type="button">K</button><button class="alt" data-letter="11" type="button">L</button><button class="alt" data-letter="12" type="button">M</button><button class="alt" data-letter="13" type="button">N</button><button class="alt" data-letter="14" type="button">Ñ</button><button class="alt" data-letter="15" type="button">O</button><button class="alt" data-letter="16" type="button">P</button><button class="alt" data-letter="17" type="button">Q</button><button class="alt" data-letter="18" type="button">R</button><button class="alt" data-letter="19" type="button">S</button><button class="alt" data-letter="20" type="button">T</button><button class="alt" data-letter="21" type="button">U</button><button class="alt" data-letter="22" type="button">V</button><button class="alt" data-letter="23" type="button">W</button><button class="alt" data-letter="24" type="button">X</button><button class="alt" data-letter="25" type="button">Y</button><button class="alt" data-letter="26" type="button">Z</button></nav>
<section class="panel challenge-stage">
<span class="tag" id="roIndex">Letra A · 1 de 27</span><div id="roClue" class="rosco-clue">Planta de tronco leñoso</div>
<div id="roAnswer" class="rosco-answer">Respuesta oculta</div>
<div class="stack"><button id="roReveal" class="alt">Mostrar respuesta</button><button id="roNext">Siguiente letra</button></div>
<p id="roStatus" class="secondary" role="status"></p>
</section>
<details class="panel ro-edit" id="roEdit"><summary>Escribir mi palabra y definición</summary>
<div class="row" style="margin-top:14px"><div class="col"><label for="roCustomWord">Palabra de esta letra</label><input id="roCustomWord" type="text" maxlength="80" autocomplete="off"></div><div class="col"><label for="roCustomClue">Definición</label><input id="roCustomClue" type="text" maxlength="220" autocomplete="off"></div></div>
<button type="button" id="roSaveCustom" class="alt">Guardar esta letra</button></details><div class="stack" style="margin-top:16px"><button id="roGenerate">Generar nuevo rosco</button><button id="roCopy" class="alt">Copiar palabras y definiciones</button></div>
<p class="secondary">El rosco es una herramienta de preparación. <a href="https://pasapalabras.mbckp-at.workers.dev" target="_blank" rel="noopener noreferrer">Abrir el juego Pasapalabras</a>.</p>
</main></body></html>
