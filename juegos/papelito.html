<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1119">
<title>Papelito · Games</title><link rel="stylesheet" href="./ui.css?v=5"><script defer src="./palabras.js?v=1"></script><script defer src="./papelito.js?v=1"></script></head>
<body class="challenge-page"><main class="wrap">
<header class="top"><a class="back" href="../">← Games</a><span class="brand">Papelito</span></header>
<h1>Papelito</h1>
<div class="challenge-metrics"><span id="paRound" class="tag">Ronda 1 · Descripción</span><span id="paRemaining" class="secondary">10 papelitos</span></div>
<section class="panel challenge-stage">
<div id="paTeam" class="secondary">Equipo A</div>
<div id="paWord" class="challenge-word">Astronauta</div>
<div id="paTime" class="challenge-time" role="timer">01:00</div>
<div class="stack"><button id="paHit">✓ Acertó · +1</button><button id="paPass" class="alt">Pasar papelito</button></div>
<div class="row challenge-controls"><button id="paStart">Iniciar turno</button><button id="paPause" class="alt" disabled>Pausar</button><button id="paNext" class="alt">Cambiar equipo</button></div>
<p id="paStatus" class="secondary" role="status">Describe libremente sin decir la palabra.</p>
</section>
<section class="panel"><div class="row between"><h2>Puntos acumulados</h2><span id="paPhase" class="secondary">Ronda 1 de 3</span></div>
<div class="scores"><div class="score active" id="paBox0"><span>Equipo A</span><strong id="paScore0">0</strong></div>
<div class="score" id="paBox1"><span>Equipo B</span><strong id="paScore1">0</strong></div></div></section>
<details class="panel" id="paOptions"><summary>Preparar la partida</summary>
<div class="row" style="margin-top:15px"><div class="col"><label for="paCount">Número de papelitos</label><input id="paCount" type="number" min="4" max="15" value="10"></div></div>
<div class="stack" style="margin-top:15px"><button id="paGenerate">Preparar nuevos papelitos</button><button id="paLocal" class="alt">Usar incluidos</button></div>
</details>
</main></body></html>
